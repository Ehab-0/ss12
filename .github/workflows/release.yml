name: Build installers

# Runs when you publish a version tag (for example v1.0.0): builds the installer for Windows, Linux and macOS,
# bundles it with the 3D files and the double-click scripts, and attaches the zips to the GitHub release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # lets the workflow attach files to the release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            name: windows
            exe: ss12.exe
          - os: ubuntu-latest
            rid: linux-x64
            name: linux
            exe: ss12
          - os: macos-latest
            rid: osx-arm64
            name: mac
            exe: ss12
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish the installer (one self-contained file, nothing to install for the user)
        run: >
          dotnet publish installer/ss12.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true -p:PublishSingleFile=true -o dist/raw

      - name: Assemble the download
        shell: bash
        run: |
          mkdir -p dist/pkg
          cp dist/raw/${{ matrix.exe }} dist/pkg/
          cp installer/overlay.manifest installer/compat.json installer/version.txt dist/pkg/
          cp -r overlay dist/pkg/overlay
          cp README.md LICENSE dist/pkg/
          mkdir -p dist/pkg/docs
          cp docs/*.md dist/pkg/docs/
          mkdir -p dist/pkg/docs/ru
          cp docs/ru/*.md dist/pkg/docs/ru/
          if [ "${{ matrix.name }}" = "windows" ]; then
            cp "scripts/install/Install 3D.bat" dist/pkg/
          else
            cp scripts/install/install-ss12.sh dist/pkg/
            chmod +x dist/pkg/install-ss12.sh dist/pkg/${{ matrix.exe }}
          fi
          cp scripts/install/START-HERE.txt scripts/install/START-HERE.ru.txt dist/pkg/

      - name: Self-test the installer
        shell: bash
        run: ./dist/pkg/${{ matrix.exe }} selftest --source dist/pkg/overlay

      - name: Zip it
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.name }}" = "windows" ]; then
            powershell -NoProfile -Command "Compress-Archive -Path pkg/* -DestinationPath SS12-installer-windows.zip"
          else
            (cd pkg && zip -qr ../SS12-installer-${{ matrix.name }}.zip .)
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: dist/SS12-installer-${{ matrix.name }}.zip

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SS12-installer-${{ matrix.name }}.zip
